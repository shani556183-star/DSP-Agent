<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner Dashboard</title>
<style>
:root{--bg:#f6f3ee;--ink:#231a15;--muted:#7a6a5f;--card:#fff;--line:#e6dccf;--brand:#c8321f;--ok:#1f7a3f}
@media (prefers-color-scheme:dark){:root{--bg:#171210;--ink:#f3e9df;--muted:#b3a496;--card:#221a16;--line:#392c25;--brand:#e5533d;--ok:#4cc27a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
h1{font-size:22px;margin:0}a{color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:26px}.stat span{color:var(--muted);font-size:13px}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:860px){.cols{grid-template-columns:1.2fr 1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto}
h2{font-size:16px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.chat{font-size:13px;border-bottom:1px solid var(--line);padding:6px 0}
.chat i{color:var(--muted);font-style:normal}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Mario's Pizza - Owner dashboard</h1><div><span class="tag" id="mode"></span> &nbsp; <a href="/">Back to website</a></div></header>
  <div class="stats">
    <div class="stat"><b id="sOrders">0</b><span>Orders</span></div>
    <div class="stat"><b id="sRev">Rs 0</b><span>Revenue</span></div>
    <div class="stat"><b id="sQ">0</b><span>Unanswered questions</span></div>
    <div class="stat"><b id="sChats">0</b><span>Messages (recent)</span></div>
  </div>
  <div class="cols">
    <div class="box"><h2>Orders</h2><div id="orders"></div></div>
    <div>
      <div class="box" style="margin-bottom:16px"><h2>Questions the agent could not answer (call back)</h2><div id="qs"></div></div>
      <div class="box"><h2>Recent chats</h2><div id="chats"></div></div>
    </div>
  </div>
</div>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load() {
  const d = await (await fetch('/api/admin')).json();
  $('mode').textContent = d.mode === 'claude' ? 'Brain: Claude' : 'Brain: offline rules';
  $('sOrders').textContent = d.orders.length;
  $('sRev').textContent = 'Rs ' + d.orders.reduce((a, o) => a + o.total, 0);
  $('sQ').textContent = d.questions.length;
  $('sChats').textContent = d.chats.length;
  $('orders').innerHTML = d.orders.length ? '<table><tr><th>ID</th><th>Customer</th><th>Items</th><th>Total</th></tr>' + d.orders.map(o =>
    '<tr><td>' + esc(o.id) + '<br><small class="tag">' + esc(o.time.slice(5, 16)) + '</small></td><td>' + esc(o.name) + '<br>' + esc(o.phone) + '<br><small>' + esc(o.address) + '</small></td><td>' +
    Object.entries(o.items).map(([k, v]) => v + ' x ' + esc(k)).join('<br>') + '</td><td>Rs ' + o.total + '<br><small>' + esc(o.channel) + '</small></td></tr>').join('') + '</table>' : '<div class="empty">No orders yet. Place one from the website chat.</div>';
  $('qs').innerHTML = d.questions.length ? d.questions.map(q => '<div class="chat">' + esc(q.question) + ' <i>' + esc(q.time.slice(5, 16)) + '</i></div>').join('') : '<div class="empty">None yet.</div>';
  $('chats').innerHTML = d.chats.length ? d.chats.slice(0, 15).map(c => '<div class="chat"><b>' + esc(c.user) + '</b><br><i>' + esc(c.bot.slice(0, 120)) + '</i></div>').join('') : '<div class="empty">No chats yet.</div>';
}
const $ = id => document.getElementById(id);
load(); setInterval(load, 4000);
</script>
</body>
</html>
