<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#d9d4cc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh}
.phone{width:min(420px,100vw);height:100vh;max-height:860px;margin:auto;background:#efeae2;display:flex;flex-direction:column;box-shadow:0 10px 40px #0004;border-radius:14px;overflow:hidden}
.top{background:#075e54;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:#fff3;display:grid;place-items:center;font-size:20px}
.top small{display:block;opacity:.8;font-size:12px}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:#efeae2}
.m{max-width:80%;padding:7px 10px;border-radius:8px;white-space:pre-wrap;font-size:14.5px;color:#111;box-shadow:0 1px 1px #0002}
.m.bot{background:#fff;align-self:flex-start}.m.me{background:#d9fdd3;align-self:flex-end}
.t{font-size:10px;color:#667;text-align:right;margin-top:2px}
form{display:flex;gap:8px;padding:8px;background:#f0f2f5}
input{flex:1;border:0;border-radius:20px;padding:11px 14px;font-size:15px;outline:none}
button{border:0;background:#075e54;color:#fff;border-radius:50%;width:44px;font-size:18px;cursor:pointer}
.note{background:#fff7d6;color:#5a4a00;font-size:12px;padding:6px 10px;text-align:center}
</style>
</head>
<body>
<div class="phone">
  <div class="top"><div class="av" id="av">💬</div><div><b id="nm">...</b><small>online - WhatsApp simulator</small></div></div>
  <div class="note">Simulator of the WhatsApp channel. Same agent as the website. Real WhatsApp needs Meta credentials (see Studio &gt; Channels).</div>
  <div id="msgs"></div>
  <form id="f"><input id="in" placeholder="Type a message" autocomplete="off"><button aria-label="Send">&#10148;</button></form>
</div>
<script>
const $ = id => document.getElementById(id);
const bid = location.pathname.split('/').filter(Boolean).pop();
const sid = 'wa-' + Math.random().toString(36).slice(2);
const tm = () => new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
function add(t, who) { const d = document.createElement('div'); d.className = 'm ' + who; d.innerHTML = '<span></span><div class="t">' + tm() + '</div>'; d.firstChild.textContent = t; $('msgs').appendChild(d); $('msgs').scrollTop = 1e9; }
async function send(t) {
  add(t, 'me');
  const r = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({biz: bid, session: sid, message: t, channel: 'whatsapp-sim'})});
  add((await r.json()).reply, 'bot');
}
$('f').onsubmit = e => { e.preventDefault(); const v = $('in').value.trim(); if (v) { $('in').value = ''; send(v); } };
fetch('/api/agents/' + bid).then(r => r.json()).then(b => { $('nm').textContent = b.name || 'Unknown'; $('av').textContent = b.emoji || '💬'; if (b.greeting) add('Hi! Welcome to ' + b.name + '. ' + b.greeting, 'bot'); });
</script>
</body>
</html>
